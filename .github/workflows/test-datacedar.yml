
name: Test DataCedar

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: pip install requests

      - name: Test DataCedar API
        env:
          DATACEDAR_KEY: ${{ secrets.DATACEDAR_KEY }}
        run: python scripts/test_datacedar.py
