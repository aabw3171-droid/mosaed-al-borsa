
name: Test EGX MCP

on:
  workflow_dispatch:

jobs:
  test-egxmcp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: pip install requests

      - name: Test EGX30 history
        env:
          EGXMCP_KEY: ${{ secrets.EGXMCP_KEY }}
        run: |
          python - <<'PY'
          import os, json, sys, requests

          url = "https://egx-mcp.essawy.workers.dev/mcp"
          key = os.environ.get("EGXMCP_KEY", "").strip()

          if not key:
              sys.exit("FAIL: EGXMCP_KEY missing")

          headers = {
              "Authorization": "Bearer " + key,
              "Content-Type": "application/json",
              "Accept": "application/json, text/event-stream"
          }

          def post(payload, sid=None):
              h = dict(headers)
              if sid:
                  h["Mcp-Session-Id"] = sid

              r = requests.post(
                  url, headers=h, json=payload, timeout=45
              )

              print("HTTP:", r.status_code)
              print("CONTENT-TYPE:", r.headers.get("content-type", ""))
              r.raise_for_status()

              new_sid = r.headers.get("Mcp-Session-Id") or sid

              # Notifications may legitimately return an empty body.
              if "id" not in payload:
                  return {}, new_sid

              if not r.text.strip():
                  raise Exception(
                      "Empty response to request. HTTP " +
                      str(r.status_code)
                  )

              ct = r.headers.get("content-type", "").lower()

              if "json" in ct:
                  data = r.json()
              else:
                  data = None
                  for line in r.text.splitlines():
                      line = line.strip()
                      if line.startswith("data:"):
                          value = line[5:].strip()
                          if value and value != "[DONE]":
                              try:
                                  data = json.loads(value)
                                  break
                              except Exception:
                                  pass

              if data is None:
                  raise Exception(
                      "Could not parse response: " + r.text[:1000]
                  )

              return data, new_sid

          init, sid = post({
              "jsonrpc": "2.0",
              "id": 1,
              "method": "initialize",
              "params": {
                  "protocolVersion": "2025-03-26",
                  "capabilities": {},
                  "clientInfo": {
                      "name": "mosaed-al-borsa-test",
                      "version": "1.0"
                  }
              }
          })

          if "error" in init:
              raise Exception(str(init["error"]))

          print("INITIALIZE: OK")

          post({
              "jsonrpc": "2.0",
              "method": "notifications/initialized",
              "params": {}
          }, sid)

          print("INITIALIZED NOTIFICATION: SENT")

          tools, sid = post({
              "jsonrpc": "2.0",
              "id": 2,
              "method": "tools/list",
              "params": {}
          }, sid)

          if "error" in tools:
              raise Exception(str(tools["error"]))

          names = [
              x["name"]
              for x in tools.get("result", {}).get("tools", [])
          ]

          print("TOOLS:", ", ".join(names))

          if "get_index_history" not in names:
              raise Exception("get_index_history not found")

          result, sid = post({
              "jsonrpc": "2.0",
              "id": 3,
              "method": "tools/call",
              "params": {
                  "name": "get_index_history",
                  "arguments": {
                      "index": "EGX30",
                      "days": 30,
                      "interval": "daily",
                      "maxRows": 50
                  }
              }
          }, sid)

          if "error" in result:
              raise Exception(str(result["error"]))

          tool = result.get("result", {})

          if tool.get("isError"):
              raise Exception(str(tool))

          data = tool.get("structuredContent")

          if data is None:
              for item in tool.get("content", []):
                  if item.get("type") == "text":
                      try:
                          data = json.loads(item["text"])
                          break
                      except Exception:
                          pass

          if not isinstance(data, dict):
              raise Exception(
                  "No structured data: " + str(tool)[:1500]
              )

          data = data.get("data", data)
          points = data.get("points", [])

          valid = [
              p for p in points
              if isinstance(p, dict)
              and p.get("date")
              and isinstance(p.get("close"), (int, float))
              and p["close"] > 0
          ]

          print("INDEX:", data.get("code"))
          print("POINTS:", len(points))
          print("VALID:", len(valid))
          print("EARLIEST:", data.get("earliestAvailable"))
          print("META:", json.dumps(
              data.get("meta", {}), ensure_ascii=False
          ))

          if valid:
              print("FIRST:", valid[0])
              print("LATEST:", valid[-1])

          if len(valid) < 5:
              raise Exception("Not enough valid EGX30 points")

          print("RESULT: PASS")
          PY
