
name: Update EGX Closing Prices

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: "تاريخ جلسة البورصة بصيغة YYYY-MM-DD"
        required: true
        default: "2026-11-23"
        type: string


jobs:
  update-prices:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip

      - name: Update EGX prices
        env:
          DATACEDAR_API_KEY: ${{ secrets.DATACEDAR_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TARGET_DATE: ${{ inputs.target_date || '' }}
        run: python scripts/update_egx_prices.py/update_egx_prices.py
