
name: Update EGX Closing Prices

on:
  workflow_dispatch:
  schedule:
    - cron: "30 13 * * 0-4"

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip

      - name: Update EGX prices
        env:
          DATACEDAR_API_KEY: ${{ secrets.DATACEDAR_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/update_egx_prices.py/update_egx_prices.py
